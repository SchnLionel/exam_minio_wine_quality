services:
  # 1. Le stockage (MinIO)
  minio:
    build:
      context: ./docker/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data

  # 2. L'assistant pour créer les buckets (dossiers)
  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/dvc-storage || true;
      mc mb myminio/mlflow-artifacts || true;
      mc anonymous set public myminio/dvc-storage;
      mc anonymous set public myminio/mlflow-artifacts;
      exit 0;
      "

  # 3. Le suivi ML (MLflow)
  mlflow:
    build:
      context: ./docker/mlflow
    ports:
      - "5000:5000"
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_S3_IGNORE_RESPONSE_AUTHENTICATION=true
    depends_on:
      - minio
      - minio-init

  # 4. Ton code (Pipeline)
  pipeline:
    build:
      context: .
      dockerfile: ./docker/pipeline/Dockerfile
    volumes:
      - .:/app
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    command: sh /app/docker/pipeline/init_dvc.sh
    depends_on:
      - minio
      - minio-init
      - mlflow

  # 5. Les tests de correction
  tests:
    build:
      context: ./tests
      dockerfile: Dockerfile
    depends_on:
      - minio
      - minio-init
      - mlflow
      - pipeline
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_DATA_BUCKET=dvc-storage
      - MINIO_MLFLOW_BUCKET=mlflow-artifacts
      - MLFLOW_TRACKING_URI=http://mlflow:5000

volumes:
  minio_data: