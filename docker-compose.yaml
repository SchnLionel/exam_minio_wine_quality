services:
  minio:
    build:
      context: ./docker/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/dvc-storage || true;
      mc mb myminio/mlflow-artifacts || true;
      mc anonymous set public myminio/dvc-storage;
      mc anonymous set public myminio/mlflow-artifacts;
      exit 0;
      "

  mlflow:
    build:
      context: ./docker/mlflow
    ports:
      - "5000:5000"
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_S3_IGNORE_RESPONSE_AUTHENTICATION=true
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_started

  pipeline:
    build:
      context: .
      dockerfile: ./docker/pipeline/Dockerfile
    volumes:
      - .:/app
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    command: sh /app/docker/pipeline/init_dvc.sh
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_started
      mlflow:
        condition: service_started

  tests:
    build:
      context: ./tests
      dockerfile: Dockerfile
    depends_on:
      - minio
      - mlflow
      - pipeline
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_DATA_BUCKET=dvc-storage
      - MINIO_MLFLOW_BUCKET=mlflow-artifacts
      - MLFLOW_TRACKING_URI=http://mlflow:5000

volumes:
  minio_data: